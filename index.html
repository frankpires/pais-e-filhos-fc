<style>
/* ── RESET & TOKENS ── */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
div, span, ul, li { outline: none; }
html { overscroll-behavior: none; height: 100%; }
:root {
  --green:    #1a3a2a;
  --green-mid:#24512e;
  --green-lit:#2d6638;
  --amber:    #f59e0b;
  --amber-dim:#b97d09;
  --cement:   #e8e4dc;
  --chalk:    #f5f2ea;
  --white:    #ffffff;
  --red:      #dc2626;
  --ink:      #111;
  --ink-soft: #555;
  --line:     rgba(0,0,0,0.10);
  --tab-h:    64px;
  --header-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--cement);
  color: var(--ink);
  height: 100%;
  overscroll-behavior: none;
  touch-action: manipulation;
}

/* ── SHELL ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--cement);
  box-shadow: 0 0 40px rgba(0,0,0,.15);
}

/* ── HEADER ── */
.app-header {
  background: var(--green);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  min-height: calc(var(--header-h) + var(--safe-top));
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.app-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.5rem;
  letter-spacing: 1px;
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.app-title .amp {
  font-family: Georgia, serif;
  font-style: italic;
  color: var(--amber);
  font-size: 1.1em;
}
.header-status {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  opacity: 0.75;
  text-transform: uppercase;
  text-align: right;
  line-height: 1.3;
}

/* ── TIMER NA QUADRA (entre times e botões de ação) ── */
.court-timer{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 16px 10px;
  flex-shrink: 0;
  background: var(--green);
}
.court-timer-display{
  font-family: 'Bebas Neue', cursive;
  font-size: 4rem;
  line-height: 1;
  letter-spacing: 4px;
  color: var(--white);
  transition: color 0.3s;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.court-timer-display.urgent{ color: var(--red); }
.court-timer-controls{
  display: flex;
  gap: 8px;
}
.court-timer-btn{
  border: 1.5px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.8);
  border-radius: 8px;
  font-size: 0.78rem;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  padding: 6px 16px;
  cursor: pointer;
  min-height: 36px;
  letter-spacing: 0.3px;
}
.court-timer-btn:active{ background: rgba(255,255,255,0.18); }
.court-timer-btn.running{ border-color: var(--red); color: var(--red); }

/* ── SCREENS ── */
.screen {
  flex: 1;
  overflow: hidden;
  display: none;
  flex-direction: column;
  min-height: 0;
}
.screen.active { display: flex; }

/* ── BOTTOM TAB BAR ── */
.tab-bar {
  display: flex;
  background: var(--green);
  border-top: 2px solid var(--green-mid);
  padding-bottom: var(--safe-bot);
  flex-shrink: 0;
  z-index: 10;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 10px 0 8px;
  border: none;
  background: none;
  color: rgba(255,255,255,0.45);
  font-family: 'Inter', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.15s;
  min-height: var(--tab-h);
}
.tab-btn .tab-icon { font-size: 1.35rem; line-height: 1; }
.tab-btn.active { color: var(--amber); }

/* ── SCOREBOARD UNIFICADO ── */
.court-block{
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--green);
  overflow: hidden;
  min-height: 0;
}
.scoreboard-unified{
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--green);
  display: flex;
  gap: 2px;
  padding: 10px 10px 0;
  align-items: stretch;
  min-height: 0;
}
.su-team{
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.su-empty-court{
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  color: rgba(255,255,255,0.3);
  text-align: center;
  font-size: 0.88rem;
  line-height: 1.6;
  gap: 8px;
}
.su-empty-court .icon{ font-size: 2.5rem; }
.su-team{
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.su-header{
  font-family: 'Bebas Neue', cursive;
  font-size: 0.75rem;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.5);
  padding: 4px 2px 6px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.su-header .adult-info{ font-family:'Inter',sans-serif; font-size:0.65rem; color:var(--amber); font-weight:700; letter-spacing:0; }
.su-player{
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--green-mid);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  transition: background 0.12s;
  border: 1.5px solid transparent;
  flex: 1;
}
.su-player:active{ background: var(--green-lit); }
.su-player .adulto-tag{
  font-size:0.58rem; font-weight:800; letter-spacing:.6px;
  background:var(--amber); color:var(--green);
  border-radius:4px; padding:2px 5px;
  flex-shrink:0; text-transform:uppercase; line-height:1.4;
}
.su-player .pname{ flex:1; color:var(--white); font-size:0.85rem; font-weight:500; line-height:1.2; }
.su-player .ptap{ color:rgba(255,255,255,0.25); font-size:0.8rem; }
.su-empty{
  background: var(--green-mid);
  border-radius: 8px;
  padding: 16px 10px;
  color: rgba(255,255,255,0.3);
  font-size: 0.78rem;
  font-style: italic;
  text-align: center;
}
/* ── VS divider between teams (timer moved to header) ── */
.su-vs{
  color: rgba(255,255,255,0.2);
  font-family: 'Bebas Neue', cursive;
  font-size: 1.1rem;
  padding: 28px 4px 0;
  flex-shrink: 0;
  align-self: flex-start;
}

/* Pulsing alert overlay when time is up */
@keyframes pulse-red{
  0%,100%{ opacity:0; }
  50%{ opacity:0.18; }
}
.timer-alert-overlay{
  position: fixed; inset: 0;
  background: var(--red);
  pointer-events: none;
  z-index: 200;
  animation: pulse-red 0.8s ease-in-out infinite;
  display: none;
}
.timer-alert-overlay.active{ display: block; }
.su-spacer{ height: 6px; }

/* ── COURT ACTIONS (fixed below scoreboard) ── */
.court-actions {
  background: var(--green);
  padding: 12px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}
.win-row {
  display: flex;
  gap: 8px;
}
.btn {
  border: none;
  border-radius: 10px;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 48px;
  padding: 0 16px;
  transition: filter 0.08s, transform 0.08s, background 0.08s;
  letter-spacing: 0.2px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:active {
  transform: scale(0.93);
  filter: brightness(0.75);
}
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }
.btn-win { flex: 1; background: #2d6638; color: var(--white); }
.btn-start { background: var(--amber); color: var(--green); width: 100%; }
.btn-tie  { background: rgba(255,255,255,0.12); color: var(--white); border: 1px solid rgba(255,255,255,0.2); width: 100%; }
.btn-danger { background: var(--red); color: var(--white); }

@keyframes btn-confirm {
  0%   { transform: scale(0.93); filter: brightness(0.75); }
  40%  { transform: scale(1.04); filter: brightness(1.25); }
  100% { transform: scale(1);    filter: brightness(1); }
}
.btn-confirming {
  animation: btn-confirm 0.3s ease-out forwards;
}

/* ── COURT HINT ── */

/* ── FILA SCREEN ── */
/* ── FILA META ── */
.fila-meta {
  padding: 5px 16px;
  font-size: 0.68rem;
  color: var(--ink-soft);
  font-weight: 500;
  letter-spacing: 0.3px;
  flex-shrink: 0;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  outline: none;
  user-select: none;
  -webkit-user-select: none;
}

/* ── FILA ADD BAR ── */
.fila-add-bar {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 10px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}
.fila-add-bar input {
  width: 100%;
  height: 44px;
  border: 1.5px solid #e0e0e0;
  border-radius: 10px;
  padding: 0 14px;
  font-size: 16px;
  font-family: 'Inter', sans-serif;
  background: var(--chalk);
  color: var(--ink);
  transition: border-color 0.15s;
}
.fila-add-bar input:focus { outline: none; border-color: var(--green); }
.fila-add-btns {
  display: flex;
  gap: 8px;
}
.fila-add-btn {
  flex: 1;
  border: none;
  border-radius: 10px;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  height: 40px;
  -webkit-tap-highlight-color: transparent;
  transition: filter 0.08s, transform 0.08s;
}
.fila-add-btn:active { transform: scale(0.95); filter: brightness(0.82); }
.fila-add-child { background: #2d6638; color: var(--white); }
.fila-add-adult { background: var(--amber); color: var(--green); }

/* ── HEADER RIGHT (status + config btn) ── */
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-config-btn {
  border: none;
  background: rgba(255,255,255,0.12);
  color: var(--white);
  border-radius: 8px;
  width: 34px; height: 34px;
  font-size: 1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.header-config-btn:active { background: rgba(255,255,255,0.25); }

/* ── CONFIG SHEET ── */
.config-sheet {
  position: fixed;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--white);
  border-radius: 18px 18px 0 0;
  padding: 12px 0 calc(20px + env(safe-area-inset-bottom));
  z-index: 200;
}
.config-sheet-title {
  font-weight: 700;
  font-size: 1rem;
  color: var(--ink);
  padding: 4px 20px 16px;
  border-bottom: 1px solid var(--line);
}
.config-sheet-body {
  padding: 8px 0;
}
.config-sheet-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}
.config-sheet-label {
  font-size: 0.9rem;
  color: var(--ink);
  font-weight: 500;
}
.config-sheet-stepper {
  display: flex;
  align-items: center;
  gap: 16px;
}
.config-sheet-stepper button {
  border: none;
  background: var(--cement);
  color: var(--ink);
  border-radius: 50%;
  width: 34px; height: 34px;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.config-sheet-stepper button:active { background: #ccc; }
.config-sheet-stepper span {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.6rem;
  color: var(--green);
  min-width: 32px;
  text-align: center;
}
.config-sheet-divider {
  height: 8px;
  background: var(--cement);
  margin: 8px 0;
}
.config-sheet-reset {
  width: 100%;
  border: none;
  background: none;
  padding: 14px 20px;
  text-align: left;
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  color: var(--red);
  font-weight: 600;
  cursor: pointer;
}
.queue-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  list-style: none;
  background: var(--white);
}
.queue-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  min-height: 52px;
}
.queue-num {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  color: var(--ink-soft);
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}
.queue-name { flex: 1; font-weight: 500; font-size: 0.88rem; }
.adult-badge {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: var(--amber);
  color: var(--green);
  border-radius: 4px;
  padding: 2px 6px;
  flex-shrink: 0;
}
.remove-btn {
  border: none; background: none;
  color: #ccc;
  font-size: 1rem;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 8px;
  flex-shrink: 0;
}
.remove-btn:active { background: #fee2e2; color: var(--red); }

.empty-state {
  padding: 40px 24px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.88rem;
  line-height: 1.6;
}
.empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

/* ── CONFIG strip ── */
.btn-reset {
  margin-left: auto;
  background: none;
  border: 1.5px solid #ddd;
  color: var(--ink-soft);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 0.75rem;
  height: 36px;
  padding: 0 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: border-color 0.15s, color 0.15s;
}
.btn-reset:active{ border-color: var(--red); color: var(--red); }

/* ── RESULTADOS SCREEN ── */
.results-list {
  list-style: none;
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--green);
  padding: 12px;
  display: block;
  min-height: 0;
}
.results-list li + li {
  margin-top: 8px;
}
.result-item {
  background: var(--green-mid);
  border-radius: 10px;
  overflow: hidden;
}
.result-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(0,0,0,0.15);
}
.result-badge {
  font-family: 'Bebas Neue', cursive;
  font-size: 0.85rem;
  letter-spacing: 1.5px;
  border-radius: 4px;
  padding: 2px 8px;
}
.result-badge.win {
  background: var(--amber);
  color: var(--green);
}
.result-badge.tie {
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
}
.result-time {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.4);
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-weight: 600;
}
.result-teams {
  display: flex;
  gap: 1px;
  padding: 0 0 0;
}
.result-team {
  flex: 1;
  padding: 8px 12px;
}
.result-team.winner {
  background: rgba(255,255,255,0.06);
}
.result-team-label {
  font-family: 'Bebas Neue', cursive;
  font-size: 0.68rem;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 3px;
}
.result-team.winner .result-team-label {
  color: var(--amber);
}
.result-players {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.75);
  line-height: 1.5;
}
.result-team.winner .result-players {
  color: var(--white);
  font-weight: 500;
}


/* ── BOTTOM SHEET ── */
/* ── SHEET TABS ── */
.sheet-tabs{
  display:flex;
  border-bottom:1px solid var(--line);
  margin-bottom:4px;
}
.sheet-tab{
  flex:1; border:none; background:none;
  font-family:'Inter',sans-serif; font-weight:700; font-size:0.82rem;
  color:var(--ink-soft); padding:10px 8px 11px;
  cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px;
  letter-spacing:.2px;
}
.sheet-tab.active{ color:var(--green); border-bottom-color:var(--green); }
.sheet-tab-content{ display:none; }
.sheet-tab-content.active{ display:block; }

.sheet-backdrop{
  position:fixed; inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
}
.action-sheet{
  position:fixed;
  bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  background:var(--white);
  border-radius:18px 18px 0 0;
  padding: 12px 0 calc(16px + env(safe-area-inset-bottom));
  z-index:51;
  max-height:75dvh;
  overflow-y:auto;
}
.sheet-handle{
  width:36px; height:4px;
  background:#ddd; border-radius:2px;
  margin:0 auto 14px;
}
.sheet-title{
  font-weight:700; font-size:0.95rem;
  padding:0 20px 12px;
  border-bottom:1px solid var(--line);
  margin-bottom:4px;
}
.sheet-option{
  display:flex; align-items:center; gap:14px;
  padding:15px 20px;
  border:none; background:none;
  width:100%; text-align:left;
  font-family:'Inter',sans-serif; font-size:0.9rem; font-weight:500;
  cursor:pointer; border-bottom:1px solid var(--line);
  color:var(--ink);
}
.sheet-option:last-child{border-bottom:none;}
.sheet-option:active{background:var(--cement);}
.sheet-option .opt-icon{font-size:1.3rem; flex-shrink:0;}
.sheet-option .opt-text{flex:1;}
.sheet-option .opt-sub{display:block; font-size:0.75rem; color:var(--ink-soft); font-weight:400; margin-top:2px;}
.sheet-option.cancel{color:#999;}
.sheet-divider{padding:8px 20px 4px; font-size:0.7rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft);}

/* ── SIMPLIFIED PLAYER ROW ── */
.player-row{
  display:flex; align-items:center; gap:10px;
  padding:13px 14px;
  background:var(--white);
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.player-row:active{background:var(--cement);}
.player-row.swap-waiting{background:#fffbeb; border-left:3px solid var(--amber);}
.player-row .chevron{color:#ccc; font-size:0.9rem; flex-shrink:0;}

/* ── MODAL (alerta simples) ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100;
  padding-bottom: var(--safe-bot);
}
.modal-sheet {
  background: var(--white);
  border-radius: 18px 18px 0 0;
  width: 100%; max-width: 480px;
  padding: 24px 20px 20px;
}
.modal-title { font-weight: 700; font-size: 1rem; margin-bottom: 8px; }
.modal-body { font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 20px; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; }
.btn-secondary { background: var(--cement); color: var(--ink); }

<body>
<div id="app">

  <!-- HEADER -->
  <header class="app-header">
    <div class="app-title">Pais <span class="amp">&amp;</span> Filhos FC</div>
    <div class="header-right">
      <div class="header-status" id="headerStatus"></div>
      <button class="header-config-btn" id="headerConfigBtn" title="Configurações">⚙</button>
    </div>
  </header>

  <!-- TELA 1: EM QUADRA -->
  <div class="screen active" id="screenQuadra">

    <!-- Bloco verde: times + timer -->
    <div class="court-block">
      <div class="scoreboard-unified" id="scoreboardUnified"></div>
      <div class="court-timer" id="courtTimer" style="display:none"></div>
    </div>

    <!-- Botões de resultado -->
    <div class="court-actions">
      <div class="win-row">
        <button class="btn btn-win" id="winA">🏆 Time A venceu</button>
        <button class="btn btn-win" id="winB">🏆 Time B venceu</button>
      </div>
      <button class="btn btn-start" id="startBtn">Iniciar partida</button>
      <button class="btn btn-tie"  id="tieBtn">Empate — tira os dois</button>
    </div>
  </div>

  <!-- TELA 2: FILA -->
  <div class="screen" id="screenFila" style="background:var(--white)">
    <!-- Campo de nome + botões compactos -->
    <div class="fila-add-bar">
      <input type="text" id="nameInput" placeholder="Nome do jogador" autocomplete="off" enterkeyhint="done">
      <div class="fila-add-btns">
        <button class="fila-add-btn fila-add-child" id="addChildBtn">+ Criança</button>
        <button class="fila-add-btn fila-add-adult" id="addAdultBtn">+ Adulto</button>
      </div>
    </div>
    <!-- Meta info + lista -->
    <div class="fila-meta" id="queueMeta"></div>
    <ul class="queue-list" id="queueList"></ul>
    <!-- Config inputs (hidden, driven by header sheet) -->
    <input type="number" id="teamSize" min="1" max="15" value="5" style="display:none">
    <input type="number" id="targetAdults" min="0" max="15" value="2" style="display:none">
    <input type="number" id="matchDuration" min="1" max="60" value="10" style="display:none">
    <button id="resetBtn" style="display:none"></button>
  </div>

  <!-- TELA 3: RESULTADOS -->
  <div class="screen" id="screenResultados">
    <ul class="results-list" id="resultsList"></ul>
  </div>

  <!-- CONFIG SHEET -->
  <div class="sheet-backdrop" id="configSheetBackdrop" style="display:none" onclick="closeConfigSheet()"></div>
  <div class="config-sheet" id="configSheet" style="display:none">
    <div class="sheet-handle"></div>
    <div class="config-sheet-title">Configurações</div>
    <div class="config-sheet-body">
      <div class="config-sheet-row">
        <label class="config-sheet-label">Jogadores por time</label>
        <div class="config-sheet-stepper">
          <button onclick="stepConfig('teamSizeSheet',-1)">−</button>
          <span id="teamSizeSheet">5</span>
          <button onclick="stepConfig('teamSizeSheet',1)">+</button>
        </div>
      </div>
      <div class="config-sheet-row">
        <label class="config-sheet-label">Adultos por time (meta)</label>
        <div class="config-sheet-stepper">
          <button onclick="stepConfig('targetAdultsSheet',-1)">−</button>
          <span id="targetAdultsSheet">2</span>
          <button onclick="stepConfig('targetAdultsSheet',1)">+</button>
        </div>
      </div>
      <div class="config-sheet-row">
        <label class="config-sheet-label">Tempo de jogo (minutos)</label>
        <div class="config-sheet-stepper">
          <button onclick="stepConfig('matchDurationSheet',-1)">−</button>
          <span id="matchDurationSheet">10</span>
          <button onclick="stepConfig('matchDurationSheet',1)">+</button>
        </div>
      </div>
      <div class="config-sheet-divider"></div>
      <button class="config-sheet-reset" id="resetBtn">🗑 Limpar fila e quadra</button>
    </div>
  </div>

  <!-- TIMER ALERT OVERLAY -->
  <div class="timer-alert-overlay" id="timerAlertOverlay"></div>

  <!-- BOTTOM SHEET (player actions) -->
  <div class="sheet-backdrop" id="sheetBackdrop" style="display:none"></div>
  <div class="action-sheet" id="actionSheet" style="display:none">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-body" id="sheetBody"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
const firebaseConfig = { databaseURL: 'https://pais-e-filhos-fc-d663b-default-rtdb.firebaseio.com' };
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const stateRef = ref(db, 'paisfilhos/state');
window._fbSave   = (data) => set(stateRef, data);
window._fbListen = (cb)   => onValue(stateRef, snap => { const v = snap.val(); if(v) cb(v); });
</script>

<script>
/* ═══════════════════════════════════════════
   ESTADO & FIREBASE
═══════════════════════════════════════════ */
let state = {
  teamSize: 5, targetAdults: 2, matchDuration: 10,
  queue: [], courtA: [], courtB: [],
  history: []
};
let swapSelection      = null;
let substituteOpenFor  = null;
let _fbReady           = false;

/* ── TIMER (sincronizado via Firebase) ──────────────────────────
   O estado do timer fica em state.timer e é salvo no Firebase.
   Cada celular calcula o tempo restante localmente a cada segundo
   a partir do timestamp de início — sem gravar no Firebase por tick.
   ─────────────────────────────────────────────────────────────── */
let timerInterval = null;
let audioCtx      = null;
let _lastAlerted  = false; // evita disparar alerta múltiplas vezes

// state.timer = {
//   running: bool,
//   startedAt: ms timestamp (quando ▶ foi pressionado),
//   secondsLeft: segundos restantes no momento em que foi pausado/criado,
//   finished: bool
// }

function matchDuration(){ return Math.max(1, parseInt(state.matchDuration)||10); }

function timerState(){ return state.timer || { running:false, startedAt:null, secondsLeft: matchDuration()*60, finished:false }; }

function timerSecondsLeft(){
  const t = timerState();
  if(t.running && t.startedAt){
    const elapsed = Math.floor((Date.now() - t.startedAt) / 1000);
    return Math.max(0, t.secondsLeft - elapsed);
  }
  return t.secondsLeft ?? matchDuration()*60;
}

function timerStart(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  const remaining = timerSecondsLeft();
  state.timer = { running:true, startedAt:Date.now(), secondsLeft:remaining, finished:false };
  _lastAlerted = false;
  document.getElementById('timerAlertOverlay').classList.remove('active');
  saveState();
  timerTickLocal();
}

function timerPause(){
  const remaining = timerSecondsLeft();
  state.timer = { running:false, startedAt:null, secondsLeft:remaining, finished:false };
  saveState();
  clearInterval(timerInterval); timerInterval=null;
  renderTimerBlock();
}

function timerReset(){
  clearInterval(timerInterval); timerInterval=null;
  state.timer = { running:false, startedAt:null, secondsLeft:matchDuration()*60, finished:false };
  _lastAlerted = false;
  document.getElementById('timerAlertOverlay').classList.remove('active');
  saveState();
  renderTimerBlock();
}

function timerTickLocal(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const t = timerState();
    if(!t.running){ clearInterval(timerInterval); return; }
    const left = timerSecondsLeft();
    renderTimerBlock();
    if(left === 0 && !_lastAlerted){
      _lastAlerted = true;
      state.timer = { running:false, startedAt:null, secondsLeft:0, finished:true };
      saveState();
      timerTimeUp();
      clearInterval(timerInterval);
    }
  }, 500); // 500ms para maior precisão
}

function timerTimeUp(){
  document.getElementById('timerAlertOverlay').classList.add('active');
  if(navigator.vibrate) navigator.vibrate([400,100,400,100,800]);
  if(audioCtx){
    try{
      [0, 0.5, 1.0].forEach(offset => {
        const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value=880;
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime+offset);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+offset+0.4);
        osc.start(audioCtx.currentTime+offset);
        osc.stop(audioCtx.currentTime+offset+0.4);
      });
    }catch(e){}
  }
  renderTimerBlock();
  setTimeout(()=>{ document.getElementById('timerAlertOverlay').classList.remove('active'); }, 5000);
}

function timerFmt(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderTimerBlock(){
  const el=document.getElementById('courtTimer');
  if(!el) return;
  const t=timerState();
  const left=timerSecondsLeft();
  const urgent=(left<=60&&left>0)||t.finished;
  const hasMatch=state.courtA.length>0||state.courtB.length>0;

  if(!hasMatch){ el.style.display='none'; return; }
  el.style.display='flex';

  el.innerHTML=`
    <div class="court-timer-display${urgent?' urgent':''}">${timerFmt(left)}</div>
    <div class="court-timer-controls">
      <button class="court-timer-btn${t.running?' running':''}">${t.running?'⏸ Pausar':'▶ Iniciar'}</button>
      <button class="court-timer-btn reset-btn">↺ Reiniciar</button>
    </div>`;
  el.querySelector('.court-timer-btn:not(.reset-btn)').onclick=t.running?timerPause:timerStart;
  el.querySelector('.reset-btn').onclick=timerReset;
}

// Quando Firebase atualiza o estado (outro celular pressionou ▶ ou ⏸),
// reage localmente: inicia ou para o tick sem gravar de volta no Firebase
function syncTimerFromRemote(){
  const t=timerState();
  clearInterval(timerInterval); timerInterval=null;
  _lastAlerted=false;
  document.getElementById('timerAlertOverlay').classList.remove('active');
  if(t.running){ timerTickLocal(); }
  renderTimerBlock();
}

function loadState(){
  render();
  const tryListen = () => {
    if(typeof window._fbListen !== 'function'){ setTimeout(tryListen, 50); return; }
    window._fbListen((remote) => {
      const wasRunning = timerState().running;
      state = Object.assign(state, remote);
      if(state.targetAdults === undefined && remote.maxAdults !== undefined)
        state.targetAdults = remote.maxAdults;
      _fbReady = true;
      // Se o estado do timer mudou remotamente, sincroniza o tick local
      const nowRunning = timerState().running;
      if(wasRunning !== nowRunning || remote.timer) syncTimerFromRemote();
      render();
    });
  };
  tryListen();
}

function saveState(isRetry){
  if(typeof window._fbSave !== 'function'){ setTimeout(() => saveState(false), 100); return; }
  window._fbSave(state).catch(e => {
    if(!isRetry){ console.warn('Retry save:', e); setTimeout(() => saveState(true), 1500); }
    else console.warn('Sync failed:', e);
  });
}

/* ═══════════════════════════════════════════
   LÓGICA DE NEGÓCIO (inalterada)
═══════════════════════════════════════════ */
function teamSize(){ return Math.max(1, parseInt(state.teamSize) || 1); }
function targetAdults(){ return Math.max(0, parseInt(state.targetAdults) ?? 2); }

function selectTeamFromQueueCopy(q, ts, target){
  const idx = [];
  for(let i=0; i<q.length; i++){ if(idx.filter(j=>q[j].adult).length >= target) break; if(q[i].adult) idx.push(i); }
  for(let i=0; i<q.length && idx.length<ts; i++){ if(!q[i].adult && !idx.includes(i)) idx.push(i); }
  for(let i=0; i<q.length && idx.length<ts; i++){ if(!idx.includes(i)) idx.push(i); }
  if(idx.length < ts) return null;
  idx.sort((a,b)=>a-b);
  const chosen = idx.map(i=>q[i]);
  for(let i=idx.length-1;i>=0;i--) q.splice(idx[i],1);
  return chosen;
}

function canFormNTeams(arr, ts, target, n){
  const copy = [...arr];
  for(let k=0;k<n;k++) if(!selectTeamFromQueueCopy(copy,ts,target)) return false;
  return true;
}

function tryFillSlots(){
  const ts=teamSize(), t=targetAdults();
  if(state.courtA.length===0){ const team=selectTeamFromQueueCopy(state.queue,ts,t); if(team) state.courtA=team; }
  if(state.courtB.length===0){ const team=selectTeamFromQueueCopy(state.queue,ts,t); if(team) state.courtB=team; }
}

function syncCourtSizes(){
  const ts=teamSize(), t=targetAdults();
  ['courtA','courtB'].forEach(key=>{
    const team=state[key]; if(!team.length) return;
    if(team.length>ts){ state.queue.unshift(...team.splice(ts)); }
    else if(team.length<ts){ state[key]=team.concat(state.queue.splice(0,ts-team.length)); }
  });
}

function addHistoryEntry(e){
  if(!state.history) state.history=[];
  state.history.push(e);
  if(state.history.length>100) state.history=state.history.slice(-100);
}

function winTeam(which){
  const loserKey=which==='A'?'courtB':'courtA', winnerKey=which==='A'?'courtA':'courtB';
  const loser=state[loserKey]; if(!loser.length) return;
  addHistoryEntry({type:'win',time:Date.now(),winner:which,winnerNames:state[winnerKey].map(p=>p.name),loserNames:loser.map(p=>p.name)});
  state.queue.push(...loser); state[loserKey]=[]; tryFillSlots();
  timerReset();
  saveState(); render();
}

function tie(){
  const ts=teamSize();
  if(!state.courtA.length||!state.courtB.length) return;
  if(state.queue.length<2*ts) return;
  addHistoryEntry({type:'empate',time:Date.now(),teamANames:state.courtA.map(p=>p.name),teamBNames:state.courtB.map(p=>p.name)});
  state.queue.push(...state.courtA,...state.courtB); state.courtA=[]; state.courtB=[];
  tryFillSlots();
  timerReset();
  saveState(); render();
}

function addToQueue(name, adult){ state.queue.push({name,adult:!!adult}); saveState(); render(); }
function removeFromQueue(i){ state.queue.splice(i,1); saveState(); render(); }

function substitutePlayer(which, idx, qi){
  const team=which==='A'?state.courtA:state.courtB;
  const incoming=state.queue[qi]; if(!incoming) return;
  state.queue.splice(qi,1); state.queue.push(team[idx]); team[idx]=incoming;
  substituteOpenFor=null; saveState(); render();
}

function toggleSubstitutePicker(which,idx){
  substituteOpenFor=(substituteOpenFor&&substituteOpenFor.team===which&&substituteOpenFor.idx===idx)?null:{team:which,idx};
  render();
}

function toggleSwapSelection(which,idx){
  if(!swapSelection){ swapSelection={team:which,idx}; }
  else if(swapSelection.team===which&&swapSelection.idx===idx){ swapSelection=null; }
  else if(swapSelection.team===which){ swapSelection={team:which,idx}; }
  else{
    const tA=swapSelection.team==='A'?state.courtA:state.courtB;
    const tB=which==='A'?state.courtA:state.courtB;
    const tmp=tA[swapSelection.idx]; tA[swapSelection.idx]=tB[idx]; tB[idx]=tmp;
    swapSelection=null; saveState();
  }
  render();
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function render(){
  const ts=teamSize(), target=targetAdults();
  // Sync hidden inputs (used by legacy render code)
  const tsEl=document.getElementById('teamSize'); if(tsEl) tsEl.value=state.teamSize;
  const taEl=document.getElementById('targetAdults'); if(taEl) taEl.value=state.targetAdults;
  const mdEl=document.getElementById('matchDuration'); if(mdEl) mdEl.value=state.matchDuration||10;
  // Sync sheet steppers if open
  const tss=document.getElementById('teamSizeSheet'); if(tss) tss.textContent=state.teamSize||5;
  const tas=document.getElementById('targetAdultsSheet'); if(tas) tas.textContent=state.targetAdults||2;
  const mds=document.getElementById('matchDurationSheet'); if(mds) mds.textContent=state.matchDuration||10;
  renderCourt(ts, target);
  renderTimerBlock();
  renderQueue(ts, target);
  renderResults();
  renderHeader(ts);
}

function renderHeader(ts){
  const el=document.getElementById('headerStatus');
  if(!el) return;
  const waiting=Math.floor(state.queue.length/ts);
  if(state.courtA.length||state.courtB.length)
    el.textContent=`${waiting} time(s) na fila`;
  else
    el.textContent='';
}

/* ═══════════════════════════════════════════
   BOTTOM SHEET
═══════════════════════════════════════════ */
function openSheet(title, bodyFn){
  document.getElementById('sheetTitle').innerHTML=title;
  const body=document.getElementById('sheetBody');
  body.innerHTML='';
  bodyFn(body);
  document.getElementById('sheetBackdrop').style.display='block';
  document.getElementById('actionSheet').style.display='block';
}
function closeSheet(){
  document.getElementById('sheetBackdrop').style.display='none';
  document.getElementById('actionSheet').style.display='none';
  swapSelection=null;
  substituteOpenFor=null;
}
document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);

function openPlayerSheet(which, idx){
  const team=which==='A'?state.courtA:state.courtB;
  const player=team[idx];
  const otherWhich=which==='A'?'B':'A';
  const otherTeam=which==='A'?state.courtB:state.courtA;

  // If we already have a swap pending from the other team, complete it
  if(swapSelection && swapSelection.team!==which){
    const tA=swapSelection.team==='A'?state.courtA:state.courtB;
    const tB=which==='A'?state.courtA:state.courtB;
    const tmp=tA[swapSelection.idx]; tA[swapSelection.idx]=tB[idx]; tB[idx]=tmp;
    swapSelection=null; saveState(); render(); closeSheet(); return;
  }

  const title=`${player.name}${player.adult?' · <span style="font-size:.7rem;font-weight:700;background:var(--amber);color:#1a3a2a;border-radius:3px;padding:1px 6px;vertical-align:middle">ADULTO</span>':''}`;
  openSheet(title, body=>{
    // ── Tab switcher ──
    const tabs=document.createElement('div');
    tabs.className='sheet-tabs';
    const tabSub=document.createElement('button');
    tabSub.className='sheet-tab active'; tabSub.textContent='↓ Substituir da fila';
    const tabSwap=document.createElement('button');
    tabSwap.className='sheet-tab'; tabSwap.textContent=`⇄ Trocar c/ Time ${otherWhich}`;
    tabs.appendChild(tabSub); tabs.appendChild(tabSwap);
    body.appendChild(tabs);

    // ── Content panes ──
    const paneSubstitute=document.createElement('div');
    paneSubstitute.className='sheet-tab-content active';
    const paneSwap=document.createElement('div');
    paneSwap.className='sheet-tab-content';

    tabSub.addEventListener('click',()=>{
      tabSub.classList.add('active'); tabSwap.classList.remove('active');
      paneSubstitute.classList.add('active'); paneSwap.classList.remove('active');
    });
    tabSwap.addEventListener('click',()=>{
      tabSwap.classList.add('active'); tabSub.classList.remove('active');
      paneSwap.classList.add('active'); paneSubstitute.classList.remove('active');
    });

    // ── Substituir pane ──
    if(state.queue.length===0){
      const empty=document.createElement('div');
      empty.className='sheet-option';
      empty.style.cssText='color:#aaa;cursor:default';
      empty.innerHTML='<span class="opt-icon">👥</span><span class="opt-text">Fila vazia<span class="opt-sub">Adicione jogadores na aba Fila</span></span>';
      paneSubstitute.appendChild(empty);
    } else {
      state.queue.forEach((qp,qi)=>{
        const opt=document.createElement('button');
        opt.className='sheet-option';
        opt.innerHTML=`<span class="opt-icon">${qp.adult?'🟡':'⚪'}</span><span class="opt-text">${qp.name}<span class="opt-sub">${qp.adult?'Adulto — ':'Criança — '}posição ${qi+1} na fila</span></span>`;
        opt.addEventListener('click',()=>{ substitutePlayer(which,idx,qi); closeSheet(); });
        paneSubstitute.appendChild(opt);
      });
    }

    // ── Trocar pane ──
    if(otherTeam.length===0){
      const empty=document.createElement('div');
      empty.className='sheet-option';
      empty.style.cssText='color:#aaa;cursor:default';
      empty.innerHTML=`<span class="opt-icon">👥</span><span class="opt-text">Time ${otherWhich} vazio</span>`;
      paneSwap.appendChild(empty);
    } else {
      otherTeam.forEach((op,oi)=>{
        const opt=document.createElement('button');
        opt.className='sheet-option';
        opt.innerHTML=`<span class="opt-icon">${op.adult?'🟡':'⚪'}</span><span class="opt-text">${op.name}<span class="opt-sub">${op.adult?'Adulto':'Criança'} · Time ${otherWhich}</span></span>`;
        opt.addEventListener('click',()=>{
          const tA=which==='A'?state.courtA:state.courtB;
          const tB=otherWhich==='A'?state.courtA:state.courtB;
          const tmp=tA[idx]; tA[idx]=tB[oi]; tB[oi]=tmp;
          swapSelection=null; saveState(); render(); closeSheet();
        });
        paneSwap.appendChild(opt);
      });
    }

    body.appendChild(paneSubstitute);
    body.appendChild(paneSwap);

    // ── Cancelar ──
    const cancel=document.createElement('button');
    cancel.className='sheet-option cancel';
    cancel.innerHTML='<span class="opt-icon">✕</span><span class="opt-text">Cancelar</span>';
    cancel.addEventListener('click', closeSheet);
    body.appendChild(cancel);
  });
}

function renderCourt(ts, target){
  const container=document.getElementById('scoreboardUnified');
  container.innerHTML='';

  const emptySlots=(state.courtA.length===0?1:0)+(state.courtB.length===0?1:0);
  const bothFull=state.courtA.length>0&&state.courtB.length>0;
  const canStart=emptySlots>0&&state.queue.length>=emptySlots*ts;
  const enoughTie=state.queue.length>=2*ts;

  const startBtn=document.getElementById('startBtn');
  startBtn.disabled=!canStart;
  startBtn.textContent=emptySlots===2?'⚽ Iniciar partida':'⚽ Preencher vaga';
  document.getElementById('winA').disabled=state.courtA.length===0;
  document.getElementById('winB').disabled=state.courtB.length===0;
  document.getElementById('tieBtn').disabled=!(bothFull&&enoughTie);

  const makeTeamCol=(which, team)=>{
    const col=document.createElement('div');
    col.className='su-team';
    const adults=team.filter(p=>p.adult).length;
    const hdr=document.createElement('div');
    hdr.className='su-header';
    hdr.innerHTML=`<span>TIME ${which}</span>${team.length?`<span class="adult-info">${adults}/${target}</span>`:''}`;
    col.appendChild(hdr);

    if(team.length===0){
      const empty=document.createElement('div');
      empty.className='su-empty';
      empty.textContent='Vaga livre';
      col.appendChild(empty);
    } else {
      team.forEach((player,idx)=>{
        const row=document.createElement('div');
        row.className='su-player';
        row.innerHTML=`
          ${player.adult?'<span class="adulto-tag">Adulto</span>':''}
          <span class="pname">${player.name}</span>
          <span class="ptap">›</span>`;
        row.addEventListener('click',()=>openPlayerSheet(which,idx));
        col.appendChild(row);
      });
    }
    const spacer=document.createElement('div');
    spacer.className='su-spacer';
    col.appendChild(spacer);
    return col;
  };

  if(state.courtA.length===0 && state.courtB.length===0){
    const empty=document.createElement('div');
    empty.className='su-empty-court';
    empty.innerHTML='<div class="icon">⚽</div>Nenhum time em quadra.<br>Adicione jogadores na aba Fila<br>e toque em <b>Iniciar partida</b>.';
    container.appendChild(empty);
  } else {
    container.appendChild(makeTeamCol('A', state.courtA));
    const vs=document.createElement('div');
    vs.className='su-vs'; vs.textContent='×';
    container.appendChild(vs);
    container.appendChild(makeTeamCol('B', state.courtB));
  }
}

function renderCourtEdit(){} // mantido para não quebrar chamadas antigas

function renderQueue(ts, target){
  const list=document.getElementById('queueList');
  const meta=document.getElementById('queueMeta');
  list.innerHTML='';
  const adults=state.queue.filter(p=>p.adult).length;
  const teams=Math.floor(state.queue.length/ts);
  meta.textContent=`${state.queue.length} jogador(es) · ${adults} adulto(s) · ${teams} time(s) completo(s)`;

  if(state.queue.length===0){
    const empty=document.createElement('li');
    empty.className='empty-state';
    empty.innerHTML='<div class="icon">👥</div>Nenhum jogador na fila.<br>Adicione pelo campo acima.';
    list.appendChild(empty);
    return;
  }
  state.queue.forEach((player,i)=>{
    const li=document.createElement('li');
    li.className='queue-item';
    li.innerHTML=`
      <span class="queue-num">${i+1}</span>
      <span class="queue-name">${player.name}</span>
      ${player.adult?'<span class="adult-badge">ADULTO</span>':''}
      <button class="remove-btn" title="Remover">✕</button>`;
    li.querySelector('.remove-btn').addEventListener('click',()=>removeFromQueue(i));
    list.appendChild(li);
  });
}

function renderResults(){
  const list=document.getElementById('resultsList');
  list.innerHTML='';
  const history=state.history||[];
  if(history.length===0){
    const empty=document.createElement('li');
    empty.className='empty-state';
    empty.style.cssText='color:rgba(255,255,255,0.35)';
    empty.innerHTML='<div class="icon">📊</div>Nenhuma partida registrada ainda.';
    list.appendChild(empty);
    return;
  }
  history.slice().reverse().forEach(entry=>{
    const li=document.createElement('li');
    li.className='result-item';
    const time=new Date(entry.time).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

    if(entry.type==='win'){
      const loserSide = entry.winner==='A' ? 'B' : 'A';
      li.innerHTML=`
        <div class="result-item-header">
          <span class="result-badge win">🏆 Vitória — Time ${entry.winner}</span>
          <span class="result-time">${time}</span>
        </div>
        <div class="result-teams">
          <div class="result-team winner">
            <div class="result-team-label">Time ${entry.winner} · Vencedor</div>
            <div class="result-players">${entry.winnerNames.join('<br>')}</div>
          </div>
          <div class="result-team">
            <div class="result-team-label">Time ${loserSide} · Saiu</div>
            <div class="result-players">${entry.loserNames.join('<br>')}</div>
          </div>
        </div>`;
    } else {
      li.innerHTML=`
        <div class="result-item-header">
          <span class="result-badge tie">Empate — os dois saíram</span>
          <span class="result-time">${time}</span>
        </div>
        <div class="result-teams">
          <div class="result-team">
            <div class="result-team-label">Time A</div>
            <div class="result-players">${entry.teamANames.join('<br>')}</div>
          </div>
          <div class="result-team">
            <div class="result-team-label">Time B</div>
            <div class="result-players">${entry.teamBNames.join('<br>')}</div>
          </div>
        </div>`;
    }
    list.appendChild(li);
  });
}

/* ═══════════════════════════════════════════
   NAVEGAÇÃO POR ABAS
═══════════════════════════════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

/* ═══════════════════════════════════════════
   EVENTOS

function handleAdd(adult){
  const input=document.getElementById('nameInput');
  const name=input.value.trim();
  if(name){ addToQueue(name,adult); input.value=''; input.focus(); }
}
/* ── CONFIG SHEET ── */
function openConfigSheet(){
  // Sync sheet values from state
  document.getElementById('teamSizeSheet').textContent = state.teamSize||5;
  document.getElementById('targetAdultsSheet').textContent = state.targetAdults||2;
  document.getElementById('matchDurationSheet').textContent = state.matchDuration||10;
  document.getElementById('configSheet').style.display='block';
  document.getElementById('configSheetBackdrop').style.display='block';
}
function closeConfigSheet(){
  document.getElementById('configSheet').style.display='none';
  document.getElementById('configSheetBackdrop').style.display='none';
}
function stepConfig(id, delta){
  const el=document.getElementById(id);
  const limits={teamSizeSheet:[1,15],targetAdultsSheet:[0,15],matchDurationSheet:[1,60]};
  const [min,max]=limits[id];
  const val=Math.min(max,Math.max(min,(parseInt(el.textContent)||0)+delta));
  el.textContent=val;
  // Apply to state immediately
  if(id==='teamSizeSheet'){ state.teamSize=val; syncCourtSizesToTeamSize(); }
  if(id==='targetAdultsSheet'){ state.targetAdults=val; }
  if(id==='matchDurationSheet'){ state.matchDuration=val; if(!timerState().running){ state.timer={...timerState(),secondsLeft:val*60}; } }
  saveState(); render();
}
document.getElementById('headerConfigBtn').addEventListener('click', openConfigSheet);

// Config toggle (legacy — no longer used but keep for safety)
// document.getElementById('configToggle')...

// Reset button (now in config sheet)
document.getElementById('resetBtn').addEventListener('click', () => {
  openSheet('Limpar fila e quadra?', body => {
    const msg = document.createElement('div');
    msg.style.cssText = 'padding:4px 20px 16px;font-size:.88rem;color:#666;line-height:1.5';
    msg.textContent = 'Remove todos os jogadores da fila e os times em quadra. O histórico de resultados é mantido.';
    body.appendChild(msg);
    const confirm = document.createElement('button');
    confirm.className = 'sheet-option';
    confirm.style.cssText = 'color:var(--red);font-weight:700';
    confirm.innerHTML = '<span class="opt-icon">🗑</span><span class="opt-text">Sim, limpar fila e quadra</span>';
    confirm.addEventListener('click', () => {
      state.queue=[]; state.courtA=[]; state.courtB=[];
      saveState(); render(); closeSheet(); closeConfigSheet();
    });
    body.appendChild(confirm);
    const cancel = document.createElement('button');
    cancel.className = 'sheet-option cancel';
    cancel.innerHTML = '<span class="opt-icon">✕</span><span class="opt-text">Cancelar</span>';
    cancel.addEventListener('click', closeSheet);
    body.appendChild(cancel);
  });
});
document.getElementById('addChildBtn').addEventListener('click',()=>handleAdd(false));
document.getElementById('addAdultBtn').addEventListener('click',()=>handleAdd(true));
document.getElementById('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); handleAdd(false); } });

/* ── FEEDBACK TÁTIL E VISUAL ── */
function confirmFeedback(btn, action){
  // Vibração curta de confirmação
  if(navigator.vibrate) navigator.vibrate(60);
  // Animação de confirmação no botão
  btn.classList.remove('btn-confirming');
  void btn.offsetWidth; // reflow para reiniciar animação
  btn.classList.add('btn-confirming');
  btn.addEventListener('animationend', () => btn.classList.remove('btn-confirming'), { once: true });
  // Executa a ação depois de um tick (deixa o visual aparecer antes)
  setTimeout(action, 80);
}

document.getElementById('startBtn').addEventListener('click', e => {
  confirmFeedback(e.currentTarget, () => { tryFillSlots(); timerReset(); saveState(); render(); });
});
document.getElementById('tieBtn').addEventListener('click', e => {
  confirmFeedback(e.currentTarget, tie);
});
document.getElementById('winA').addEventListener('click', e => {
  confirmFeedback(e.currentTarget, () => winTeam('A'));
});
document.getElementById('winB').addEventListener('click', e => {
  confirmFeedback(e.currentTarget, () => winTeam('B'));
});


loadState();

// Registra Service Worker para PWA (funciona quando hospedado no Vercel)
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

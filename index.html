<style>
/* ── RESET & TOKENS ── */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html { overscroll-behavior: none; height: 100%; }
:root {
  --green:    #1a3a2a;
  --green-mid:#24512e;
  --green-lit:#2d6638;
  --amber:    #f59e0b;
  --amber-dim:#b97d09;
  --cement:   #e8e4dc;
  --chalk:    #f5f2ea;
  --white:    #ffffff;
  --red:      #dc2626;
  --ink:      #111;
  --ink-soft: #555;
  --line:     rgba(0,0,0,0.10);
  --tab-h:    64px;
  --header-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--cement);
  color: var(--ink);
  height: 100%;
  overscroll-behavior: none;
  touch-action: manipulation;
}

/* ── SHELL ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--cement);
  box-shadow: 0 0 40px rgba(0,0,0,.15);
}

/* ── HEADER ── */
.app-header {
  background: var(--green);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  min-height: calc(var(--header-h) + var(--safe-top));
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.app-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.5rem;
  letter-spacing: 1px;
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.app-title .amp {
  font-family: Georgia, serif;
  font-style: italic;
  color: var(--amber);
  font-size: 1.1em;
}
.header-status {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  opacity: 0.75;
  text-transform: uppercase;
  text-align: right;
  line-height: 1.3;
}

/* ── SCREENS ── */
.screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  display: none;
  flex-direction: column;
}
.screen.active { display: flex; }

/* ── BOTTOM TAB BAR ── */
.tab-bar {
  display: flex;
  background: var(--green);
  border-top: 2px solid var(--green-mid);
  padding-bottom: var(--safe-bot);
  flex-shrink: 0;
  z-index: 10;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 10px 0 8px;
  border: none;
  background: none;
  color: rgba(255,255,255,0.45);
  font-family: 'Inter', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.15s;
  min-height: var(--tab-h);
}

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
const firebaseConfig = { databaseURL: 'https://pais-e-filhos-fc-d663b-default-rtdb.firebaseio.com' };
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const stateRef = ref(db, 'paisfilhos/state');
window._fbSave   = (data) => set(stateRef, data);
window._fbListen = (cb)   => onValue(stateRef, snap => { const v = snap.val(); if(v) cb(v); });
</script>

<script>
/* ═══════════════════════════════════════════
   ESTADO & FIREBASE
═══════════════════════════════════════════ */
let state = {
  teamSize: 5, targetAdults: 2,
  queue: [], courtA: [], courtB: [],
  history: []
};
let swapSelection      = null;
let substituteOpenFor  = null;
let _fbReady           = false;

function loadState(){
  render(); // mostra a UI imediatamente; Firebase atualiza quando conectar
  const tryListen = () => {
    if(typeof window._fbListen !== 'function'){ setTimeout(tryListen, 50); return; }
    window._fbListen((remote) => {
      state = Object.assign(state, remote);
      if(state.targetAdults === undefined && remote.maxAdults !== undefined)
        state.targetAdults = remote.maxAdults;
      _fbReady = true;
      render();
    });
  };
  tryListen();
}

function saveState(isRetry){
  if(typeof window._fbSave !== 'function'){ setTimeout(() => saveState(false), 100); return; }
  window._fbSave(state).catch(e => {
    if(!isRetry){ console.warn('Retry save:', e); setTimeout(() => saveState(true), 1500); }
    else console.warn('Sync failed:', e);
  });
}

/* ═══════════════════════════════════════════
   LÓGICA DE NEGÓCIO (inalterada)
═══════════════════════════════════════════ */
function teamSize(){ return Math.max(1, parseInt(state.teamSize) || 1); }
function targetAdults(){ return Math.max(0, parseInt(state.targetAdults) ?? 2); }

function selectTeamFromQueueCopy(q, ts, target){
  const idx = [];
  for(let i=0; i<q.length; i++){ if(idx.filter(j=>q[j].adult).length >= target) break; if(q[i].adult) idx.push(i); }
  for(let i=0; i<q.length && idx.length<ts; i++){ if(!q[i].adult && !idx.includes(i)) idx.push(i); }
  for(let i=0; i<q.length && idx.length<ts; i++){ if(!idx.includes(i)) idx.push(i); }
  if(idx.length < ts) return null;
  idx.sort((a,b)=>a-b);
  const chosen = idx.map(i=>q[i]);
  for(let i=idx.length-1;i>=0;i--) q.splice(idx[i],1);
  return chosen;
}

function canFormNTeams(arr, ts, target, n){
  const copy = [...arr];
  for(let k=0;k<n;k++) if(!selectTeamFromQueueCopy(copy,ts,target)) return false;
  return true;
}

function tryFillSlots(){
  const ts=teamSize(), t=targetAdults();
  if(state.courtA.length===0){ const team=selectTeamFromQueueCopy(state.queue,ts,t); if(team) state.courtA=team; }
  if(state.courtB.length===0){ const team=selectTeamFromQueueCopy(state.queue,ts,t); if(team) state.courtB=team; }
}

function syncCourtSizes(){
  const ts=teamSize(), t=targetAdults();
  ['courtA','courtB'].forEach(key=>{
    const team=state[key]; if(!team.length) return;
    if(team.length>ts){ state.queue.unshift(...team.splice(ts)); }
    else if(team.length<ts){ state[key]=team.concat(state.queue.splice(0,ts-team.length)); }
  });
}

function addHistoryEntry(e){
  if(!state.history) state.history=[];
  state.history.push(e);
  if(state.history.length>100) state.history=state.history.slice(-100);
}

function winTeam(which){
  const loserKey=which==='A'?'courtB':'courtA', winnerKey=which==='A'?'courtA':'courtB';
  const loser=state[loserKey]; if(!loser.length) return;
  addHistoryEntry({type:'win',time:Date.now(),winner:which,winnerNames:state[winnerKey].map(p=>p.name),loserNames:loser.map(p=>p.name)});
  state.queue.push(...loser); state[loserKey]=[]; tryFillSlots(); saveState(); render();
}

function tie(){
  const ts=teamSize();
  if(!state.courtA.length||!state.courtB.length) return;
  if(state.queue.length<2*ts) return;
  addHistoryEntry({type:'empate',time:Date.now(),teamANames:state.courtA.map(p=>p.name),teamBNames:state.courtB.map(p=>p.name)});
  state.queue.push(...state.courtA,...state.courtB); state.courtA=[]; state.courtB=[];
  tryFillSlots(); saveState(); render();
}

function addToQueue(name, adult){ state.queue.push({name,adult:!!adult}); saveState(); render(); }
function removeFromQueue(i){ state.queue.splice(i,1); saveState(); render(); }

function substitutePlayer(which, idx, qi){
  const team=which==='A'?state.courtA:state.courtB;
  const incoming=state.queue[qi]; if(!incoming) return;
  state.queue.splice(qi,1); state.queue.push(team[idx]); team[idx]=incoming;
  substituteOpenFor=null; saveState(); render();
}

function toggleSubstitutePicker(which,idx){
  substituteOpenFor=(substituteOpenFor&&substituteOpenFor.team===which&&substituteOpenFor.idx===idx)?null:{team:which,idx};
  render();
}

function toggleSwapSelection(which,idx){
  if(!swapSelection){ swapSelection={team:which,idx}; }
  else if(swapSelection.team===which&&swapSelection.idx===idx){ swapSelection=null; }
  else if(swapSelection.team===which){ swapSelection={team:which,idx}; }
  else{
    const tA=swapSelection.team==='A'?state.courtA:state.courtB;
    const tB=which==='A'?state.courtA:state.courtB;
    const tmp=tA[swapSelection.idx]; tA[swapSelection.idx]=tB[idx]; tB[idx]=tmp;
    swapSelection=null; saveState();
  }
  render();
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function render(){
  const ts=teamSize(), target=targetAdults();
  document.getElementById('teamSize').value=state.teamSize;
  document.getElementById('targetAdults').value=state.targetAdults;
  renderCourt(ts, target);
  renderQueue(ts, target);
  renderResults();
  renderHeader(ts);
}

function renderHeader(ts){
  const el=document.getElementById('headerStatus');
  const waiting=Math.floor(state.queue.length/ts);
  const inA=state.courtA.length, inB=state.courtB.length;
  if(inA||inB) el.innerHTML=`Em jogo: ${inA}×${inB}<br>${waiting} time(s) na fila`;
  else el.textContent='Nenhum jogo em andamento';
}

/* ═══════════════════════════════════════════
   BOTTOM SHEET
═══════════════════════════════════════════ */
function openSheet(title, bodyFn){
  document.getElementById('sheetTitle').innerHTML=title;
  const body=document.getElementById('sheetBody');
  body.innerHTML='';
  bodyFn(body);
  document.getElementById('sheetBackdrop').style.display='block';
  document.getElementById('actionSheet').style.display='block';
}
function closeSheet(){
  document.getElementById('sheetBackdrop').style.display='none';
  document.getElementById('actionSheet').style.display='none';
  swapSelection=null;
  substituteOpenFor=null;
}
document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);

function openPlayerSheet(which, idx){
  const team=which==='A'?state.courtA:state.courtB;
  const player=team[idx];
  const otherWhich=which==='A'?'B':'A';
  const otherTeam=which==='A'?state.courtB:state.courtA;

  // If we already have a swap pending from the other team, complete it
  if(swapSelection && swapSelection.team!==which){
    const tA=swapSelection.team==='A'?state.courtA:state.courtB;
    const tB=which==='A'?state.courtA:state.courtB;
    const tmp=tA[swapSelection.idx]; tA[swapSelection.idx]=tB[idx]; tB[idx]=tmp;
    swapSelection=null; saveState(); render(); closeSheet(); return;
  }

  const title=`${player.name}${player.adult?' · <span style="font-size:.7rem;font-weight:700;background:var(--amber);color:#1a3a2a;border-radius:3px;padding:1px 6px;vertical-align:middle">PAI</span>':''}`;
  openSheet(title, body=>{
    // ── Tab switcher ──
    const tabs=document.createElement('div');
    tabs.className='sheet-tabs';
    const tabSub=document.createElement('button');
    tabSub.className='sheet-tab active'; tabSub.textContent='↓ Substituir da fila';
    const tabSwap=document.createElement('button');
    tabSwap.className='sheet-tab'; tabSwap.textContent=`⇄ Trocar c/ Time ${otherWhich}`;
    tabs.appendChild(tabSub); tabs.appendChild(tabSwap);
    body.appendChild(tabs);

    // ── Content panes ──
    const paneSubstitute=document.createElement('div');
    paneSubstitute.className='sheet-tab-content active';
    const paneSwap=document.createElement('div');
    paneSwap.className='sheet-tab-content';

    tabSub.addEventListener('click',()=>{
      tabSub.classList.add('active'); tabSwap.classList.remove('active');
      paneSubstitute.classList.add('active'); paneSwap.classList.remove('active');
    });
    tabSwap.addEventListener('click',()=>{
      tabSwap.classList.add('active'); tabSub.classList.remove('active');
      paneSwap.classList.add('active'); paneSubstitute.classList.remove('active');
    });

    // ── Substituir pane ──
    if(state.queue.length===0){
      const empty=document.createElement('div');
      empty.className='sheet-option';
      empty.style.cssText='color:#aaa;cursor:default';
      empty.innerHTML='<span class="opt-icon">👥</span><span class="opt-text">Fila vazia<span class="opt-sub">Adicione jogadores na aba Fila</span></span>';
      paneSubstitute.appendChild(empty);
    } else {
      state.queue.forEach((qp,qi)=>{
        const opt=document.createElement('button');
        opt.className='sheet-option';
        opt.innerHTML=`<span class="opt-icon">${qp.adult?'🟡':'⚪'}</span><span class="opt-text">${qp.name}<span class="opt-sub">${qp.adult?'Pai — ':'Criança — '}posição ${qi+1} na fila</span></span>`;
        opt.addEventListener('click',()=>{ substitutePlayer(which,idx,qi); closeSheet(); });
        paneSubstitute.appendChild(opt);
      });
    }

    // ── Trocar pane ──
    if(otherTeam.length===0){
      const empty=document.createElement('div');
      empty.className='sheet-option';
      empty.style.cssText='color:#aaa;cursor:default';
      empty.innerHTML=`<span class="opt-icon">👥</span><span class="opt-text">Time ${otherWhich} vazio</span>`;
      paneSwap.appendChild(empty);
    } else {
      otherTeam.forEach((op,oi)=>{
        const opt=document.createElement('button');
        opt.className='sheet-option';
        opt.innerHTML=`<span class="opt-icon">${op.adult?'🟡':'⚪'}</span><span class="opt-text">${op.name}<span class="opt-sub">${op.adult?'Pai':'Criança'} · Time ${otherWhich}</span></span>`;
        opt.addEventListener('click',()=>{
          const tA=which==='A'?state.courtA:state.courtB;
          const tB=otherWhich==='A'?state.courtA:state.courtB;
          const tmp=tA[idx]; tA[idx]=tB[oi]; tB[oi]=tmp;
          swapSelection=null; saveState(); render(); closeSheet();
        });
        paneSwap.appendChild(opt);
      });
    }

    body.appendChild(paneSubstitute);
    body.appendChild(paneSwap);

    // ── Cancelar ──
    const cancel=document.createElement('button');
    cancel.className='sheet-option cancel';
    cancel.innerHTML='<span class="opt-icon">✕</span><span class="opt-text">Cancelar</span>';
    cancel.addEventListener('click', closeSheet);
    body.appendChild(cancel);
  });
}

function renderCourt(ts, target){
  const container=document.getElementById('scoreboardUnified');
  container.innerHTML='';

  const emptySlots=(state.courtA.length===0?1:0)+(state.courtB.length===0?1:0);
  const bothFull=state.courtA.length>0&&state.courtB.length>0;
  const canStart=emptySlots>0&&state.queue.length>=emptySlots*ts;
  const enoughTie=state.queue.length>=2*ts;

  const startBtn=document.getElementById('startBtn');
  startBtn.disabled=!canStart;
  startBtn.textContent=emptySlots===2?'⚽ Iniciar partida':'⚽ Preencher vaga';
  document.getElementById('winA').disabled=state.courtA.length===0;
  document.getElementById('winB').disabled=state.courtB.length===0;
  document.getElementById('tieBtn').disabled=!(bothFull&&enoughTie);

  const hint=document.getElementById('courtHint');
  if(bothFull&&!enoughTie) hint.textContent='Empate só tira os dois quando há 2 times completos esperando';
  else if(bothFull&&enoughTie) hint.textContent='Empate agora tira os dois times de quadra';
  else hint.textContent='';

  const makeTeamCol=(which, team)=>{
    const col=document.createElement('div');
    col.className='su-team';
    const adults=team.filter(p=>p.adult).length;
    const hdr=document.createElement('div');
    hdr.className='su-header';
    hdr.innerHTML=`<span>TIME ${which}</span>${team.length?`<span class="adult-info">${adults}/${target}</span>`:''}`;
    col.appendChild(hdr);

    if(team.length===0){
      const empty=document.createElement('div');
      empty.className='su-empty';
      empty.textContent='Vaga livre';
      col.appendChild(empty);
    } else {
      team.forEach((player,idx)=>{
        const row=document.createElement('div');
        row.className='su-player';
        row.innerHTML=`
          ${player.adult?'<span class="pai-tag">Pai</span>':''}
          <span class="pname">${player.name}</span>
          <span class="ptap">›</span>`;
        row.addEventListener('click',()=>openPlayerSheet(which,idx));
        col.appendChild(row);
      });
    }
    const spacer=document.createElement('div');
    spacer.className='su-spacer';
    col.appendChild(spacer);
    return col;
  };

  if(state.courtA.length===0 && state.courtB.length===0){
    const empty=document.createElement('div');
    empty.className='su-empty-court';
    empty.innerHTML='<div class="icon">⚽</div>Nenhum time em quadra.<br>Adicione jogadores na aba Fila<br>e toque em <b>Iniciar partida</b>.';
    container.appendChild(empty);
  } else {
    container.appendChild(makeTeamCol('A', state.courtA));
    const vs=document.createElement('div');
    vs.className='su-vs'; vs.textContent='×';
    container.appendChild(vs);
    container.appendChild(makeTeamCol('B', state.courtB));
  }
}

function renderCourtEdit(){} // mantido para não quebrar chamadas antigas

function renderQueue(ts, target){
  const list=document.getElementById('queueList');
  const meta=document.getElementById('queueMeta');
  list.innerHTML='';
  const adults=state.queue.filter(p=>p.adult).length;
  const teams=Math.floor(state.queue.length/ts);
  meta.textContent=`${state.queue.length} jogador(es) · ${adults} adulto(s) · ${teams} time(s) completo(s)`;

  if(state.queue.length===0){
    const empty=document.createElement('li');
    empty.className='empty-state';
    empty.innerHTML='<div class="icon">👥</div>Nenhum jogador na fila.<br>Adicione pelo campo acima.';
    list.appendChild(empty);
    return;
  }
  state.queue.forEach((player,i)=>{
    const li=document.createElement('li');
    li.className='queue-item';
    li.innerHTML=`
      <span class="queue-num">${i+1}</span>
      <span class="queue-name">${player.name}</span>
      ${player.adult?'<span class="adult-badge">ADULTO</span>':''}
      <button class="remove-btn" title="Remover">✕</button>`;
    li.querySelector('.remove-btn').addEventListener('click',()=>removeFromQueue(i));
    list.appendChild(li);
  });
}

function renderResults(){
  const list=document.getElementById('resultsList');
  list.innerHTML='';
  const history=state.history||[];
  if(history.length===0){
    list.innerHTML='<li class="empty-state"><div class="icon">📊</div>Nenhuma partida registrada ainda.</li>';
    return;
  }
  history.slice().reverse().forEach(entry=>{
    const li=document.createElement('li');
    li.className='result-item';
    const time=new Date(entry.time).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(entry.type==='win'){
      li.innerHTML=`
        <div class="result-header">
          <span class="result-badge win">Vitória</span>
          <span class="result-time">${time}</span>
        </div>
        <div class="result-names"><b>Time ${entry.winner}:</b> ${entry.winnerNames.join(', ')}<br><span>Saiu: ${entry.loserNames.join(', ')}</span></div>`;
    } else {
      li.innerHTML=`
        <div class="result-header">
          <span class="result-badge tie">Empate</span>
          <span class="result-time">${time}</span>
        </div>
        <div class="result-names">A: ${entry.teamANames.join(', ')}<br>B: ${entry.teamBNames.join(', ')}</div>`;
    }
    list.appendChild(li);
  });
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.screen).classList.add('active');
  });
});

   EVENTOS
═══════════════════════════════════════════ */
function handleAdd(adult){
  const input=document.getElementById('nameInput');
  const name=input.value.trim();
  if(name){ addToQueue(name,adult); input.value=''; input.focus(); }
}
document.getElementById('addChildBtn').addEventListener('click',()=>handleAdd(false));
document.getElementById('addAdultBtn').addEventListener('click',()=>handleAdd(true));
document.getElementById('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); handleAdd(false); } });

document.getElementById('startBtn').addEventListener('click',()=>{ tryFillSlots(); saveState(); render(); });
document.getElementById('tieBtn').addEventListener('click',tie);
document.getElementById('winA').addEventListener('click',()=>winTeam('A'));
document.getElementById('winB').addEventListener('click',()=>winTeam('B'));

document.getElementById('teamSize').addEventListener('change',e=>{
  state.teamSize=Math.max(1,parseInt(e.target.value)||1);
  syncCourtSizes(); saveState(); render();
});
document.getElementById('targetAdults').addEventListener('change',e=>{
  state.targetAdults=Math.max(0,parseInt(e.target.value)||0);
  saveState(); render();
});

loadState();
</script>
